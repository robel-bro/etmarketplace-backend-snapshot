# config/recurring.yml

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  price_drop_check:
    class: PriceDropCheckJob
    schedule: every 30 minutes

  release_expired_cart_items:
    class: ReleaseExpiredCartItemsJob
    schedule: every 5 minutes

  release_expired_reservations:
    class: ReleaseExpiredReservationsJob
    schedule: every 1 minute

  membership_expiry:
    class: MembershipExpiryJob
    schedule: "0 0 * * *"

  notifications_send_promotions_monday:
    command: "rake notifications:send_promotions"
    schedule: "0 10 * * 1"

  notifications_send_promotions_wednesday:
    command: "rake notifications:send_promotions"
    schedule: "0 10 * * 3"

  notifications_send_promotions_friday:
    command: "rake notifications:send_promotions"
    schedule: "0 10 * * 5"